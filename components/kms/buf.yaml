version: v2

# The module root: import paths are relative to `api/`, and must mirror the
# proto package (enforced by the `PACKAGE_DIRECTORY_MATCH` lint rule), e.g.
# package `kms.v1` -> `api/kms/v1/*.proto` -> `import "kms/v1/kms.proto"`.
modules:
  - path: api

  # Makes it possible to annotate fields in `.proto` files
  # with [validation constraints](https://protovalidate.com).
  # A middleweare on the GRPC server then can read these validation
  # logic in GRPC field descriptors (generated in the `.pb.go` files): It compiles that
  # descriptor "strings" on the GRPC field annotation to a [CEL](https://github.com/cel-expr/cel-spec)-abstract-syntax-tree once
  # which is cached and then re-using it to validate against
  # given values on the resp. field.
  - path: external/proto/protovalidate
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
