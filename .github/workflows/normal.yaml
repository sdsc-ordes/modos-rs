name: normal
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false

      matrix:
        include:
          - name: lint-security
            command: just ci::run quitsh exec-target "global::lint-security"
            allow_failure: true

          - name: lint-nix-hash
            command: just ci::run quitsh nix fix-hash
            allow_failure: false

          - name: lint-kms
            command: just ci::run quitsh lint -c "kms"
            allow_failure: false
          - name: lint-comp-rust
            command: just ci::run quitsh lint -c "comp-rust"
            allow_failure: false

          - name: build-kms
            command: just ci::run quitsh build -c "kms"
            allow_failure: false

          - name: build-comp-rust
            command: just ci::run quitsh build -c "comp-rust"
            allow_failure: false

          - name: test-kms
            command: just ci::run quitsh test -c "kms"
            allow_failure: false
          - name: test-comp-rust
            command: just ci::run quitsh test -c "comp-rust"
            allow_failure: false
          - name: test-quitsh
            command: just ci::run quitsh test -c "quitsh"
            allow_failure: false

          - name: image-kms
            command: just ci::run quitsh image -c "kms"
            allow_failure: false
          - name: image-comp-rust
            command: just ci::run quitsh image -c "comp-rust"
            allow_failure: false

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
        with:
          cachix_cache_name: "${{ secrets.CACHIX_CACHE_NAME }}"
          cachix_auth_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: ${{ matrix.name }}
        continue-on-error: ${{ matrix.allow_failure }}
        run: ${{ matrix.command }}

      - name: ${{ matrix.name }}-artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: |
            .output/run/process-compose
          if-no-files-found: ignore
          retention-days: 3
